<svg xmlns="http://www.w3.org/2000/svg" width="96" height="28" viewBox="0 0 96 28">
  <!-- Tileable Mithila border: the triangle-and-comb motif used to frame
       Madhubani panels. Repeats horizontally at any width. -->
  <g fill="none" stroke="#f0c040" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 2h96M0 26h96"/>

    <!-- triangle with nested triangle -->
    <path d="M6 26 16 8l10 18z"/>
    <path d="M12 26 16 18l4 8z"/>

    <!-- comb hatching with a seed dot -->
    <path d="M36 26v-7M41 26v-11M46 26v-13M51 26v-11M56 26v-7"/>

    <!-- second triangle, inverted, for rhythm -->
    <path d="M66 8 76 26 86 8z"/>
    <path d="M72 8 76 16l4-8z"/>
  </g>
  <g fill="#f0c040">
    <circle cx="46" cy="10" r="1.6"/>
    <circle cx="16" cy="4.6" r="1.3"/>
    <circle cx="76" cy="23.4" r="1.3"/>
  </g>
</svg>
